<svg xmlns="http://www.w3.org/2000/svg" width="850" height="150" viewBox="0 0 850 150">
  <defs>
    <!-- Gradient for the graph line (Cyan to Purple to Orange) -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#ff0844" />
    </linearGradient>

    <!-- Glow filter for the graph nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Animated graph line */
    .graph-line {
      stroke: url(#lineGrad);
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      animation: drawLine 3s ease-out forwards;
    }
    
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    /* Pulsating glow for the nodes */
    .node {
      fill: #ffffff;
      filter: url(#glow);
      animation: pulse 2s infinite alternate;
    }

    .node:nth-child(1) { animation-delay: 0s; }
    .node:nth-child(2) { animation-delay: 0.5s; }
    .node:nth-child(3) { animation-delay: 1s; }
    .node:nth-child(4) { animation-delay: 1.5s; }

    @keyframes pulse {
      0% { opacity: 0.5; r: 2.5; }
      100% { opacity: 1; r: 4; }
    }

    /* Blinking terminal cursor for the orange dot */
    .cursor {
      fill: #ff5722;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Text styling */
    .title { font: bold 48px 'Segoe UI', Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
    .subtitle { font: 14px 'Courier New', monospace; fill: #8b949e; }
  </style>

  <!-- LEFT SIDE: Text and Subtitle -->
  <text x="20" y="75" class="title">Shreyas</text>
  
  <!-- Blinking Orange Dot -->
  <circle cx="215" cy="75" r="6" class="cursor" />
  
  <!-- Terminal-style Subtitle -->
  <text x="20" y="105" class="subtitle">systems architecture · artificial intelligence · full-stack</text>

  <!-- RIGHT SIDE: The Animated Graph -->
  <!-- A slightly more dynamic, tech-focused path -->
  <path class="graph-line" d="M 500,90 L 550,90 L 590,50 L 660,50 L 710,95 L 780,95" />
  
  <!-- Glowing, pulsating static nodes on the graph -->
  <circle cx="550" cy="90" r="3" class="node" />
  <circle cx="590" cy="50" r="3" class="node" />
  <circle cx="660" cy="50" r="3" class="node" />
  <circle cx="710" cy="95" r="3" class="node" />
</svg>
